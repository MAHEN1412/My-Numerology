<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerology Tools</title>
<style>
  :root {
    --purple: #5B1E75;
    --purple-dark: #4A1861;
    --gold: #FFC800;
    --bg: #1A1A1A;
    --text: #F3EFE9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 48px 24px 64px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 40px;
    color: var(--text);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 32px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
  }
  .badge {
    width: 118px;
    height: 118px;
    transition: transform 0.15s ease;
  }
  .item:hover .badge { transform: scale(1.06); }
  .item:active .badge { transform: scale(0.97); }
  .item span {
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
    max-width: 140px;
  }
  @media (max-width: 480px) {
    .badge { width: 92px; height: 92px; }
    .grid { gap: 24px 16px; }
  }
</style>
</head>
<body>

<h1>Numerology Tools</h1>

<div class="grid" id="grid"></div>

<script>
// Reusable outer badge: purple circle, 8 radiating spokes, thin gold inner ring.
// Each icon is inserted into the center via the `icon` template string.
function badgeSVG(icon) {
  return `
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="58" fill="var(--purple)"/>
    <g stroke="var(--gold)" stroke-width="1.5">
      <line x1="60" y1="2"  x2="60" y2="18"/>
      <line x1="60" y1="102" x2="60" y2="118"/>
      <line x1="2"  y1="60" x2="18" y2="60"/>
      <line x1="102" y1="60" x2="118" y2="60"/>
      <line x1="19.7" y1="19.7" x2="31.6" y2="31.6"/>
      <line x1="88.4" y1="88.4" x2="100.3" y2="100.3"/>
      <line x1="19.7" y1="100.3" x2="31.6" y2="88.4"/>
      <line x1="88.4" y1="31.6" x2="100.3" y2="19.7"/>
    </g>
    <circle cx="60" cy="60" r="38" fill="var(--purple)" stroke="var(--gold)" stroke-width="1.5"/>
    ${icon}
  </svg>`;
}

  celebrity: `
    <polygon points="60,38 65,54 82,54 68,64 73,80 60,70 47,80 52,64 38,54 55,54" fill="var(--gold)"/>

      <rect x="52" y="59" width="16" height="9" rx="1.5"/>

      <line x1="65" y1="55" x2="65" y2="59" stroke="var(--purple)" stroke-width="1.4"/>

  books: `
    <g fill="var(--gold)">
      <polygon points="60,40 74,47 60,54 46,47"/>
      <polygon points="46,53 60,60 74,53 74,58 60,65 46,58"/>
      <polygon points="46,61 60,68 74,61 74,66 60,73 46,66"/>
      <polygon points="46,69 60,76 74,69 74,74 60,81 46,74"/>
    </g>`,
};

const TOOLS = [
  { icon: 'dashboard',    title: 'Dashboard',                          tab: 'tab0' },
  { icon: 'loshu',        title: 'Lo Shu Grid Calculator',             tab: 'tab1' },
  { icon: 'mobile',       title: 'Mobile Number Compatibility',        tab: 'tab2' },
  { icon: 'crystal',      title: 'Crystal Compatibility Calculator',   tab: 'tab3' },
  { icon: 'business',     title: 'Business Name Compatibility',        tab: 'tab4' },
  { icon: 'numbercompat', title: 'Number Compatibility Calculator',    tab: 'tab5' },
  { icon: 'relationship', title: 'Relationship Compatibility Calculator', tab: 'tab6' },
  { icon: 'namecalc',     title: 'Numerology Name Calculator',         tab: 'tab11' },
  { icon: 'luckynumber',  title: 'Lucky Number Finder',                tab: 'tab13' },
  { icon: 'news',         title: 'Numerology News',                    tab: 'tab9' },
  { icon: 'celebrity',    title: 'Celebrity Birthdays',                tab: 'tab10' },
  { icon: 'books',        title: 'Manage Books',                       tab: null, href: '/admin.html' },
];

const grid = document.getElementById('grid');
TOOLS.forEach((t) => {
  const a = document.createElement('a');
  a.className = 'item';
  a.href = t.href || ('/index.html?tab=' + t.tab);
  if (t.href) { a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = `<div class="badge">${badgeSVG(ICONS[t.icon])}</div><span>${t.title}</span>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
