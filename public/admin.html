<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Library \u2014 Numerology Consultant Engine</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#F8FAFC; --navy-2:#F1F5F9; --surface:#FFFFFF; --surface-2:#EEF2FF;
    --border:#E2E8F0; --border-strong:#CBD5E1;
    --indigo:#4F46E5; --violet:#4338CA; --gold:#CA8A04;
    --text:#0F172A; --text-dim:#475569; --text-muted:#94A3B8;
    --danger:#DC2626;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh;}
  h1,h2{font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:800;margin:0;color:var(--text);}
  .topbar{height:72px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;}
  .topbar-logo-title{font-size:19px;font-weight:800;color:var(--indigo);letter-spacing:.4px;}
  .topbar-logo-sub{font-size:9px;color:var(--text-muted);font-weight:700;display:block;margin-top:2px;letter-spacing:.05em;}
  .topbar-back{margin-left:auto;font-size:13px;font-weight:600;color:var(--text-dim);text-decoration:none;padding:8px 14px;border-radius:8px;}
  .topbar-back:hover{background:var(--navy-2);}
  .wrap{max-width:720px;margin:0 auto;padding:40px 24px 56px;}
  .card{background:var(--surface);border:1px solid #EDF1F5;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,0.03);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:500;margin-bottom:8px;color:var(--text);}
  .field input{
    width:100%;background:var(--navy-2);border:1px solid var(--border-strong);border-radius:10px;
    padding:12px 14px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(67,56,202,0.15);}
  button{
    font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
    padding:11px 17px;border-radius:9px;border:none;background:var(--indigo);color:#fff;
  }
  button:hover:not(:disabled){background:var(--violet);}
  button:disabled{opacity:0.6;cursor:default;}
  button.ghost{background:var(--surface-2);color:var(--violet);}
  button.ghost:hover:not(:disabled){background:var(--navy-2);}
  button.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:6px 12px;font-size:12px;font-weight:600;}
  button.danger:hover:not(:disabled){background:rgba(220,38,38,0.06);}
  .err{color:var(--danger);font-size:13px;margin-top:10px;display:none;}
  .err.show{display:block;}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  .book-item{display:flex;justify-content:space-between;align-items:center;background:var(--navy-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .book-item .bt{font-size:14px;font-weight:600;}
  .book-item .bm{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .empty{font-size:13px;color:var(--text-muted);}
  .loading{font-size:13px;color:var(--text-dim);}
  a{color:var(--violet);font-size:13px;}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <span class="topbar-logo-title">NUMEROLOGY</span>
    <span class="topbar-logo-sub">CONSULTANT ENGINE</span>
  </div>
  <a href="/" class="topbar-back">&larr; Back to app</a>
</header>
<div class="wrap">

  <div id="loginView">
    <h1 style="text-align:center;margin-bottom:24px;font-size:22px;">Book Library</h1>
    <div class="card" style="max-width:360px;margin:0 auto;">
      <div class="field">
        <label for="passwordInput">Admin password</label>
        <input type="password" id="passwordInput" autocomplete="current-password">
      </div>
      <div class="err" id="loginError"></div>
      <button id="loginBtn" style="width:100%;margin-top:8px;">Log in</button>
    </div>
  </div>

  <div id="panelView" style="display:none;">
    <div class="top-row">
      <h1 style="font-size:22px;">Book Library</h1>
      <button class="ghost" id="logoutBtn">Log out</button>
    </div>

    <div class="card" style="margin-bottom:32px;">
      <h2 style="font-size:18px;margin-bottom:16px;">Upload a book</h2>
      <div class="field">
        <label for="bookTitleInput">Book title</label>
        <input type="text" id="bookTitleInput" placeholder="e.g. Numerology: With Tantra, Ayurveda, and Astrology">
      </div>
      <div class="field">
        <label for="bookAuthorInput">Author <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
        <input type="text" id="bookAuthorInput" placeholder="e.g. Harish Johari">
      </div>
      <div class="field">
        <label for="bookEditionInput">Edition <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
        <input type="text" id="bookEditionInput" placeholder="e.g. 1st edition, 2011">
      </div>
      <div class="field">
        <label for="bookFileInput">PDF file</label>
        <input type="file" id="bookFileInput" accept="application/pdf">
      </div>
      <div class="err" id="uploadError"></div>
      <button id="uploadBtn">Upload book</button>
    </div>

    <h2 style="font-size:18px;margin-bottom:16px;">Uploaded books</h2>
    <div id="bookListContainer"></div>
  </div>

</div>

<script>
const loginView = document.getElementById('loginView');
const panelView = document.getElementById('panelView');

async function checkSession() {
  const res = await fetch('/api/admin/me');
  const data = await res.json();
  if (data.loggedIn) {
    loginView.style.display = 'none';
    panelView.style.display = 'block';
    loadBookList();
  } else {
    loginView.style.display = 'block';
    panelView.style.display = 'none';
  }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const password = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in\u2026';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Login failed.'; errEl.classList.add('show'); return; }
    document.getElementById('passwordInput').value = '';
    checkSession();
  } catch (err) {
    errEl.textContent = 'Could not reach the server.'; errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Log in';
  }
});

document.getElementById('passwordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  checkSession();
});

async function loadBookList() {
  const container = document.getElementById('bookListContainer');
  container.innerHTML = '<p class="loading">Loading\u2026</p>';
  try {
    const res = await fetch('/api/books');
    if (res.status === 401) { checkSession(); return; }
    const data = await res.json();
    container.innerHTML = '';
    if (!data.books || data.books.length === 0) {
      container.innerHTML = '<p class="empty">No books uploaded yet.</p>';
      return;
    }
    data.books.forEach(b => {
      const item = document.createElement('div');
      item.className = 'book-item';
      item.innerHTML = `
        <div>
          <div class="bt">${b.title}</div>
          <div class="bm">${b.author ? b.author + ' \u00b7 ' : ''}${b.pageCount} pages${b.edition ? ' \u00b7 ' + b.edition : ''}</div>
        </div>
        <button class="danger" data-id="${b._id}">Remove</button>
      `;
      item.querySelector('button').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Removing\u2026';
        await fetch(`/api/books/${e.target.dataset.id}`, { method: 'DELETE' });
        loadBookList();
      });
      container.appendChild(item);
    });
  } catch (err) {
    container.innerHTML = '<p class="empty">Could not load books right now.</p>';
  }
}

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const titleEl = document.getElementById('bookTitleInput');
  const authorEl = document.getElementById('bookAuthorInput');
  const editionEl = document.getElementById('bookEditionInput');
  const fileEl = document.getElementById('bookFileInput');
  const errEl = document.getElementById('uploadError');
  const btn = document.getElementById('uploadBtn');

  errEl.classList.remove('show');
  if (!titleEl.value.trim()) { errEl.textContent = 'A book title is required.'; errEl.classList.add('show'); return; }
  if (!fileEl.files[0]) { errEl.textContent = 'Choose a PDF file to upload.'; errEl.classList.add('show'); return; }

  const formData = new FormData();
  formData.append('title', titleEl.value.trim());
  formData.append('author', authorEl.value.trim());
  formData.append('edition', editionEl.value.trim());
  formData.append('file', fileEl.files[0]);

  btn.disabled = true; btn.textContent = 'Uploading and indexing\u2026';
  try {
    const res = await fetch('/api/books', { method: 'POST', body: formData });
    if (res.status === 401) { checkSession(); return; }
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Upload failed.'; errEl.classList.add('show'); return; }
    titleEl.value = ''; authorEl.value = ''; editionEl.value = ''; fileEl.value = '';
    loadBookList();
  } catch (err) {
    errEl.textContent = 'Could not reach the server.'; errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Upload book';
  }
});

checkSession();
</script>
</body>
</html>
